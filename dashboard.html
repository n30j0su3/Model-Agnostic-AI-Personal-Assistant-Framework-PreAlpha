/* FreakingJSON Cyberpunk Neon Effects */

              0 0 20px rgba(242, 252, 158, 0.5),
              0 0 40px rgba(242, 252, 158, 0.3);
}
.neon-text {
  text-shadow: 0 0 5px rgba(242, 252, 158, 0.8),
               0 0 10px rgba(242, 252, 158, 0.5);
}
.card-cyber {
  background: linear-gradient(135deg, #0a0a0a 0%, #141414 100%);
  border: 1px solid rgba(242, 252, 158, 0.2);
}
.card-cyber:hover {
  border-color: rgba(242, 252, 158, 0.5);

}
.gradient-cyber {
  background: linear-gradient(135deg, #0a0a0a 0%, #0f0f0f 50%, #141414 100%);

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        .animate-slide-in { animation: slideInLeft 0.3s ease-out; }
        
        /* KPI Card hover effect */
        .kpi-card {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #f2fc9e, #8b5cf6);
        }
        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        
        /* Glass effect */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #f2fc9e, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Skeleton loading */
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        /* Page transition */
        .page-transition {
            animation: fadeIn 0.3s ease-out;
        }
        
        /* Sidebar active state */
        .nav-item {
            position: relative;
            transition: all 0.2s;
        }
        .nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: #f2fc9e;
            transition: height 0.2s;
            border-radius: 0 3px 3px 0;
        }
        .nav-item:hover::before,
        .nav-item.active::before {
            height: 60%;
        }
        .nav-item.active {
            background: rgba(59, 130, 246, 0.1);
            color: #f2fc9e;
        }
        
        /* Chat message styles */
        .message-agent {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px 12px 12px 4px;
        }
        .message-user {
            background: linear-gradient(135deg, #f2fc9e, #f2fc9e);
            border-radius: 12px 12px 4px 12px;
        }
        
        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideInLeft 0.3s ease-out;
        }
        
        /* Workflow Styles */
        .workflow-step {
            transition: all 0.3s ease;
        }
        
        .workflow-step:hover {
            transform: translateX(4px);
        }
        
        .step-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #475569;
            border-radius: 0.375rem;
            background-color: #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .step-checkbox:checked {
            background-color: #f2fc9e;
            border-color: #f2fc9e;
        }
        
        .step-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        .step-checkbox:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        
        /* Workflow Toast */
        .workflow-toast {
            animation: slideInRight 0.3s ease-out;
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Mobile responsiveness for workflow */
        @media (max-width: 768px) {
            .workflow-step {
                flex-direction: column;
                gap: 0.75rem;
            }
            
            .workflow-step .step-indicator {
                align-self: flex-start;
            }
        }
        
        /* Toggle Switch Animation */
        .peer:checked ~ .peer-checked\:bg-amber-500 {
            background-color: #f59e0b;
        }
        
        .peer:checked ~ .peer-checked\:after\:translate-x-full::after {
            transform: translateX(100%);
        }

        /* Matrix rain + scanlines (Command Center blend) */
        .matrix-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.08; overflow: hidden; }
        .matrix-bg canvas { width: 100%; height: 100%; }
        .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 2; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.2), rgba(0,0,0,0.2) 1px, transparent 1px, transparent 2px); opacity: .35; }

        :focus-visible { outline: 2px solid #f2fc9e; outline-offset: 2px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .matrix-bg, .scanlines { display: none !important; }
        }

        const dataLoader = {
            async loadAll() {
                try {
                    await Promise.all([
                        this.loadSessions(),
                        this.loadInteractions(),
                        this.loadSkills(),
                        this.loadAgents(),
                        this.loadLPSErrors()
                    ]);
                    this.calculateStats();
                    return true;
                } catch (error) {
                    console.error('Error loading data:', error);
                    this.loadDemoData();
                    return false;
                }
            },

            async loadSessions() {
                try {
                    const response = await fetch('core/.context/knowledge/sessions-index.json');
                    if (response.ok) {
                        const data = await response.json();
                        store.sessions = data.sessions || [];
                        store.stats.totalSessions = data.total_sessions || 0;
                        return;
                    }
                } catch (e) {
                    console.warn('[Sessions] Fetch failed (CORS), using embedded data');
                }
                // Fallback a datos incrustados (file:// compatible)
                store.sessions = window.DASHBOARD_DATA?.sessions || [];
                store.stats.totalSessions = store.sessions.length;
            },

                const sessionDates = store.sessions.map(s => s.date || s.id).sort();
                const last30Days = Array.from({length: 30}, (_, i) => {

        // ============================================
        // WORKFLOW MANAGER - Interactive Workflow Guide
        // ============================================
        const workflowManager = {
            state: {
                steps: {},
                expressMode: false,
                complexity: 'simple'
            },

            init() {
                this.loadState();
                this.updateUI();
                
                // Add event listeners to checkboxes
                document.querySelectorAll('.step-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', (e) => {
                        const step = parseInt(e.target.dataset.step);
                        this.state.steps[step] = e.target.checked;
                        this.saveState();
                        this.updateUI();
                    });
                });
            },

            toggleStep(step) {
                this.state.steps[step] = !this.state.steps[step];
                this.saveState();
                this.updateUI();
            },

            toggleExpressMode() {
                this.state.expressMode = !this.state.expressMode;
                
                // Guardar en localStorage para persistencia entre sesiones
                configManager.setSetting('expressMode', this.state.expressMode);
                
                this.updateUI();
                this.showToast(
                    this.state.expressMode 
                        ? 'Modo Express ACTIVADO - Salta planificación (paso 3). Ideal para tareas simples.' 
                        : 'Modo Express DESACTIVADO - Flujo completo de 7 pasos. Recomendado para features complejas.'
                );
            },

            toggleComplexity() {
                this.state.complexity = this.state.complexity === 'simple' ? 'complex' : 'simple';
                this.saveState();
                this.updateUI();
            },

            markAllComplete() {
                for (let i = 1; i <= 7; i++) {
                    this.state.steps[i] = true;
                }
                this.saveState();
                this.updateUI();
                this.showToast('¡Todos los pasos completados!');
            },

            resetAll() {
                this.state.steps = {};
                this.state.expressMode = false;
                this.saveState();
                this.updateUI();
                this.showToast('Workflow reiniciado');
            },

            updateUI() {
                // Update checkboxes
                document.querySelectorAll('.step-checkbox').forEach(checkbox => {
                    const step = parseInt(checkbox.dataset.step);
                    checkbox.checked = !!this.state.steps[step];
                });

                // Update step indicators
                document.querySelectorAll('.workflow-step').forEach((stepEl, index) => {
                    const step = index + 1;
                    const isCompleted = !!this.state.steps[step];
                    const isInProgress = !isCompleted && this.isStepInProgress(step);
                    const indicator = stepEl.querySelector('.step-indicator');
                    
                    // Update indicator appearance
                    if (isCompleted) {
                        indicator.className = 'step-indicator flex-shrink-0 w-12 h-12 rounded-full bg-green-500 flex items-center justify-center text-white font-bold z-10 transition-all duration-300 ring-4 ring-green-500/20';
                        indicator.innerHTML = '✓';
                        stepEl.classList.add('opacity-75');
                    } else if (isInProgress) {
                        indicator.className = 'step-indicator flex-shrink-0 w-12 h-12 rounded-full bg-amber-500 flex items-center justify-center text-white font-bold z-10 transition-all duration-300 ring-4 ring-amber-500/20 animate-pulse';
                        indicator.innerHTML = step;
                        stepEl.classList.remove('opacity-75');
                    } else {
                        indicator.className = 'step-indicator flex-shrink-0 w-12 h-12 rounded-full bg-slate-600 flex items-center justify-center text-white font-bold z-10 transition-all duration-300';
                        indicator.innerHTML = step;
                        stepEl.classList.remove('opacity-75');
                    }
                });

                // Update express mode UI
                const expressToggle = document.getElementById('express-mode-toggle');
                if (expressToggle) {
                    expressToggle.checked = this.state.expressMode;
                }

                // Show/hide express skip text for step 3
                document.querySelectorAll('.express-skip').forEach(el => {
                    el.classList.toggle('hidden', !this.state.expressMode);
                });

                // Update complexity badge
                const complexityValue = document.getElementById('complexity-value');
                const complexityBadge = document.getElementById('complexity-badge');
                if (complexityValue && complexityBadge) {
                    if (this.state.complexity === 'simple') {
                        complexityValue.textContent = 'Simple';
                        complexityValue.className = 'font-semibold text-lime-300';
                        complexityBadge.className = 'px-4 py-2 bg-lime-400/10 border border-lime-400/30 rounded-lg flex items-center gap-2';
                    } else {
                        complexityValue.textContent = 'Complex';
                        complexityValue.className = 'font-semibold text-purple-400';
                        complexityBadge.className = 'px-4 py-2 bg-purple-500/10 border border-purple-500/30 rounded-lg flex items-center gap-2';
                    }
                }

                // Update progress bar
                const completedSteps = Object.values(this.state.steps).filter(Boolean).length;
                const totalSteps = 7;
                const progressPercent = (completedSteps / totalSteps) * 100;
                
                const progressBar = document.getElementById('progress-bar');
                const progressText = document.getElementById('progress-text');
                
                if (progressBar) {
                    progressBar.style.width = progressPercent + '%';
                }
                if (progressText) {
                    progressText.textContent = `${completedSteps}/${totalSteps} pasos completados`;
                }
            },

            isStepInProgress(step) {
                // Step 4 (Execution) is always "in progress" until completed
                if (step === 4) return true;
                
                // Previous steps should be completed for next step to be in progress
                for (let i = 1; i < step; i++) {
                    if (!this.state.steps[i]) return false;
                }
                return true;
            },

            saveState() {
                try {
                    localStorage.setItem('freakingjson-workflow-state', JSON.stringify(this.state));
                } catch (e) {
                    console.warn('Could not save workflow state:', e);
                }
            },

            loadState() {
                try {
                    const saved = localStorage.getItem('freakingjson-workflow-state');
                    if (saved) {
                        this.state = { ...this.state, ...JSON.parse(saved) };
                    }
                    
                    // Cargar modo express de config
                    const expressMode = configManager.getSetting('expressMode', false);
                    this.state.expressMode = expressMode;
                    
                } catch (e) {
                    console.warn('Could not load workflow state:', e);
                }
            },

            showToast(message) {
                const existing = document.querySelector('.workflow-toast');
                if (existing) existing.remove();

                const toast = document.createElement('div');
                toast.className = 'workflow-toast fixed bottom-20 right-4 px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg shadow-lg z-50 animate-slide-in';
                toast.innerHTML = `
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        <span class="text-sm">${message}</span>
                    </div>
                `;
                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        };

        // ============================================
        // MODAL MANAGER - Sistema de modales reutilizable
        // ============================================
        const modalManager = {
            open(content, options = {}) {
                const { maxWidth = 'max-w-2xl', onClose } = options;
                
                const overlay = document.createElement('div');
                overlay.className = 'fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in';
                overlay.onclick = () => this.close(overlay);
                
                const modal = document.createElement('div');
                modal.className = `${maxWidth} bg-slate-900 border border-slate-800 rounded-xl shadow-2xl max-h-[80vh] overflow-y-auto animate-slide-in`;
                modal.onclick = e => e.stopPropagation();
                
                modal.innerHTML = `
                    <div class="sticky top-0 bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
                        <button onclick="modalManager.close(this.closest('.fixed'))" class="text-slate-400 hover:text-white transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                    <div class="p-6">${content}</div>
                `;
                
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                
                // Keyboard escape
                const handleEsc = e => {
                    if (e.key === 'Escape') {
                        this.close(overlay);
                        document.removeEventListener('keydown', handleEsc);
                    }
                };
                document.addEventListener('keydown', handleEsc);
                
                if (onClose) onClose();
            },
            
            close(overlay) {
                if (!overlay) return;
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 300);
            },

            escapeHtml(text = '') {
                return String(text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            },

            initMatrixRain() {
                const canvas = document.getElementById('matrix-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                resize();
                window.addEventListener('resize', resize);

                const chars = 'アイウエオカキクケコサシスセソ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                const fontSize = 14;
                const columns = () => Math.floor(canvas.width / fontSize);
                let drops = Array(columns()).fill(1);

                const draw = () => {
                    ctx.fillStyle = 'rgba(2, 6, 23, 0.08)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#f2fc9e';
                    ctx.font = `${fontSize}px monospace`;
                    for (let i = 0; i < drops.length; i++) {
                        const text = chars[Math.floor(Math.random() * chars.length)];
                        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                        drops[i]++;
                    }
                    if (drops.length !== columns()) drops = Array(columns()).fill(1);
                };

                setInterval(draw, 50);
            },

        // PA CONSOLE — puente con dashboard_server.py (v0.5.0-alpha)
        // ============================================
        const paConsole = {
            session: null,
            busy: false,

            async api(path, method = 'GET', body = null) {
                const opts = { method, headers: { 'Content-Type': 'application/json' } };
                if (body) opts.body = JSON.stringify(body);
                const r = await fetch(path, opts);
                if (!r.ok && r.status !== 502 && r.status !== 503) {
                    throw new Error(`HTTP ${r.status}`);
                }
                return r.json();
            },

            log(role, text) {
                const el = document.getElementById('pa-chat-log');
                if (!el) return;
                const wrap = document.createElement('div');
                const mine = role === 'user';
                wrap.className = mine
                    ? 'flex justify-end'
                    : 'flex justify-start';
                const colors = { user: 'bg-lime-400/90 text-slate-900', assistant: 'bg-slate-800 text-slate-100', sys: 'bg-amber-500/20 text-amber-200' };
                wrap.innerHTML = `<div class="${colors[role] || colors.sys} rounded-xl px-3 py-2 max-w-[85%] whitespace-pre-wrap break-words">${this.esc(text)}</div>`;
                el.appendChild(wrap);
                el.scrollTop = el.scrollHeight;
            },

            esc(s) {
                return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            },

            async init() {
                try {
                    const s = await this.api('/api/status');
                    const badge = document.getElementById('pa-bridge-status');
                    if (badge) badge.textContent = `🟢 bridge v${s.framework.version} · opencode ${s.opencode.serving ? '🟢' : (s.opencode.installed ? '⚫ (on-demand)' : '🔴 no instalado')}`;
                    const det = document.getElementById('pa-status-detail');
                    if (det) det.innerHTML =
                        `<div>framework: <span class="text-lime-400">${s.framework.version}</span></div>` +
                        `<div>opencode: ${s.opencode.installed ? 'instalado' : 'NO instalado'} ${s.opencode.serving ? '· sirviendo en :' + s.opencode.port : ''}</div>`;
                    document.getElementById('pa-bridge-offline')?.classList.add('hidden');
                    await this.loadSessions();
                } catch {
                    const off = document.getElementById('puente-offline') || document.getElementById('pa-bridge-offline');
                    off?.classList.remove('hidden');
                    const badge = document.getElementById('pa-bridge-status');
                    if (badge) badge.textContent = '🔴 sin puente';
                }
            },

            async send() {
                const input = document.getElementById('pa-chat-input');
                if (!input || this.busy) return;
                const msg = input.value.trim();
                if (!msg) return;
                input.value = '';
                this.log('user', msg);
                this.busy = true;
                const status = document.getElementById('pa-chat-status');
                if (status) status.textContent = '…pensando';
                try {
                    const r = await this.api('/api/opencode/chat', 'POST', { message: msg, session: this.session });
                    if (r.ok) {
                        this.session = r.session || this.session;
                        this.log('assistant', r.reply || '(sin texto)');
                    } else {
                        this.log('sys', `⚠ ${r.error || 'error del puente'}`);
                    }
                } catch (e) {
                    this.log('sys', `⚠ puente offline (${e.message})`);
                } finally {
                    this.busy = false;
                    if (status) status.textContent = '';
                }
            },

            async loadSessions() {
                try {
                    const r = await this.api('/api/opencode/sessions');
                    const el = document.getElementById('pa-oc-sessions');
                    if (!el) return;
                    const list = (r.sessions || []).slice(0, 12);
                    if (!list.length) { el.innerHTML = '<div class="text-slate-600">—</div>'; return; }
                    el.innerHTML = list.map(s => {
                        const title = this.esc(s.title || s.slug || s.id);
                        const active = s.id === this.session ? 'text-lime-400' : '';
                        return `<div class="cursor-pointer hover:text-white ${active}" onclick="paConsole.openSession('${s.id}')">• ${title}</div>`;
                    }).join('');
                } catch { /* bridge off */ }
            },

            async openSession(id) {
                this.session = id;
                try {
                    const r = await this.api(`/api/opencode/messages/${id}`);
                    const el = document.getElementById('pa-chat-log');
                    if (!el) return;
                    el.innerHTML = '';
                    for (const m of (r.messages || [])) {
                        const role = m.info?.role === 'user' ? 'user' : (m.info?.role === 'assistant' ? 'assistant' : null);
                        if (!role) continue;
                        const text = (m.parts || []).filter(p => p.type === 'text').map(p => p.text).join('\n').trim();
                        if (text) this.log(role, text);
                    }
                    this.loadSessions();
                } catch { }
            },

            currentConfig: null,
            async loadConfig(which) {
                try {
                    const r = await this.api('/api/files/config');
                    const f = r.files?.[which];
                    const ta = document.getElementById('pa-config-editor');
                    const pathEl = document.getElementById('pa-config-path');
                    if (!f || !ta) return;
                    if (!f.exists) { ta.value = ''; pathEl.textContent = `${f.path} (no existe — se creará al guardar)`; }
                    else { ta.value = f.content; pathEl.textContent = f.path; }
                    this.currentConfig = which;
                } catch {
                    document.getElementById('pa-config-editor')?.setAttribute('placeholder', t('console_bridge_off'));
                }
            },

            async saveConfig() {
                if (!this.currentConfig) return;
                const ta = document.getElementById('pa-config-editor');
                try {
                    const r = await this.api('/api/files/config', 'POST', { file: this.currentConfig, content: ta.value });
                    if (r.ok) {
                        const pathEl = document.getElementById('pa-config-path');
                        if (pathEl) pathEl.textContent = `✓ ${r.saved} (con backup .bak)`;
                    }
                } catch { }
            },

            async launchTUI() {
                try {
                    const r = await this.api('/api/launch/opencode-tui', 'POST', {});
                    this.log('sys', r.ok ? `🚀 ${r.hint || 'TUI lanzada'}` : `⚠ ${r.error}`);
                } catch (e) {
                    this.log('sys', `⚠ ${e.message}`);
                }
            },

            async bootstrap() {
                const status = document.getElementById('pa-chat-status');
                if (status) status.textContent = '…init framework';
                try {
                    const r = await this.api('/api/framework/bootstrap');
                    this.log('sys', r.ok ? '✅ Framework inicializado (session_start OK)' : `⚠ session_start: ${(r.output || '').slice(-200)}`);
                } catch (e) {
                    this.log('sys', `⚠ ${e.message}`);
                } finally {
                    if (status) status.textContent = '';
                }
            }
        };

        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    
        // ============================================
        // MODELO PAGE — Selección de modelo IA
        // ============================================
        const modeloPage = {
            currentModel: '',
            
            async init() {
                await this.loadCurrentModel();
            },
            
            async loadCurrentModel() {
                try {
                    const resp = await fetch('/config');
                    if (resp.ok) {
                        const cfg = await resp.json();
                        this.currentModel = cfg.model || '(no configurado)';
                    }
                } catch(e) {
                    // fallback: leer de .opencode/config.json
                    try {
                        const resp = await fetch('.opencode/config.json');
                        if (resp.ok) {
                            const cfg = await resp.json();
                            this.currentModel = cfg.model || '(no configurado)';
                        }
                    } catch(e2) {
                        this.currentModel = '(no configurado)';
                    }
                }
                const el = document.getElementById('modelo-current');
                if (el) el.textContent = this.currentModel;
            },
            
            async detect() {
                const btn = document.getElementById('modelo-detect-btn');
                const results = document.getElementById('modelo-results');
                const select = document.getElementById('modelo-select');
                
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = 'Detectando…';
                }
                
                try {
                    const resp = await fetch('/api/models/free');
                    if (!resp.ok) throw new Error('No response');
                    const models = await resp.json();
                    
                    if (models && models.length > 0) {
                        select.innerHTML = '<option value="">Selecciona un modelo…</option>';
                        models.forEach(m => {
                            const opt = document.createElement('option');
                            opt.value = m;
                            opt.textContent = m;
                            select.appendChild(opt);
                        });
                        if (results) results.classList.remove('hidden');
                    } else {
                        this.showFeedback('No se encontraron modelos free', 'error');
                    }
                } catch(e) {
                    this.showFeedback('Error: no se pudo conectar con opencode serve. Ejecuta dashboard_server.py primero.', 'error');
                }
                
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = 'Detectar modelos free';
                }
            },
            
            async save() {
                const select = document.getElementById('modelo-select');
                const model = select.value;
                const feedback = document.getElementById('modelo-feedback');
                
                if (!model) {
                    this.showFeedback('Selecciona un modelo primero', 'error');
                    return;
                }
                
                try {
                    const resp = await fetch('/config', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({model: model})
                    });
                    
                    if (resp.ok) {
                        this.showFeedback('✓ Modelo guardado en .opencode/config.json', 'success');
                        this.currentModel = model;
                        await this.loadCurrentModel();
                    } else {
                        throw new Error('Save failed');
                    }
                } catch(e) {
                    this.showFeedback('✗ Error al guardar', 'error');
                }
            },
            
            showFeedback(msg, type) {
                const el = document.getElementById('modelo-feedback');
                if (el) {
                    el.textContent = msg;
                    el.className = 'mt-4 text-sm ' + (type === 'error' ? 'text-red-400' : 'text-lime-400');
                }
            }
        };
</script>
</body>
</html>
